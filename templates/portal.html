<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>品质生活情报库</title>
<style>
:root{--bg:#f7f5f1;--paper:#fff;--ink:#151515;--muted:#777;--faint:#aaa;--line:#e7e1d8;--line2:#d9d0c4;--accent:#8a6a3f;--accent2:#b08a54;--chip:#f0ebe3;--good:#2f7a4d;--blue:#386fa4}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
.site-header{position:sticky;top:0;z-index:20;background:rgba(247,245,241,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.header-inner{max-width:980px;margin:0 auto;height:56px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font-size:17px;font-weight:700;letter-spacing:.08em}
.brand small{display:block;font-size:10px;font-weight:500;letter-spacing:.24em;color:var(--faint);line-height:1.2}
.nav{display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap}
.nav button,.admin-link{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.nav button.active{color:var(--accent);background:#8a6a3f12}
.admin-link{border:1px solid var(--line);background:var(--paper)}
.main{max-width:820px;margin:0 auto;padding:28px 18px 64px}
.page-title{margin-bottom:18px}
.page-title h1{font-size:28px;line-height:1.25;font-weight:750;letter-spacing:.02em}
.page-title p{margin-top:6px;color:var(--muted);font-size:14px}
.category-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;margin-bottom:10px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.chip.active{border-color:var(--accent);background:#8a6a3f12;color:var(--accent);font-weight:650}
.filters{display:grid;grid-template-columns:1fr 150px 116px 116px;gap:8px;margin:2px 0 26px}
.search{position:relative}
.search input,.filters select{width:100%;height:38px;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:0 12px;color:var(--ink);outline:none}
.search input:focus,.filters select:focus{border-color:var(--accent2)}
.meta-line{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
.date-group{margin-top:28px}
.date-heading{display:flex;align-items:center;gap:12px;margin-bottom:8px;color:var(--muted);font-weight:700}
.date-heading:after{content:"";height:1px;background:var(--line);flex:1}
.item{padding:17px 0 19px;border-bottom:1px solid var(--line)}
.item-top{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.score{margin-left:auto;color:var(--accent);font-weight:750}
.level{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:var(--paper);color:var(--muted)}
.level.must{border-color:#c99d54;color:#8a5a15;background:#fff6e6}.level.rec{border-color:#8cb1d1;color:#245b87;background:#edf6ff}.level.know{border-color:#b7d6bd;color:#2f7a4d;background:#f0fbf2}
.title{font-size:18px;line-height:1.55;font-weight:750;margin-bottom:7px}
.title a:hover{color:var(--accent)}
.summary{font-size:14px;color:#444;margin-bottom:9px}
.reason{font-size:14px;color:#4c4338;background:#8a6a3f0d;border-left:3px solid var(--accent2);padding:9px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;color:var(--accent);background:#8a6a3f10;border-radius:4px;padding:2px 7px;cursor:pointer}
.image-strip{display:flex;gap:8px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px}
.image-strip img{height:118px;max-width:190px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--chip);cursor:pointer}
.related{font-size:13px;color:var(--muted);margin-top:8px}
.empty{padding:72px 0;text-align:center;color:var(--faint)}
.sources-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:18px}
.source-card{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px 12px}
.source-card b{display:block;font-size:13px}.source-card span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.about{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:22px;line-height:2}
.about h2{font-size:20px;margin-bottom:10px}.about p{color:#444;margin-top:10px}
.image-modal{position:fixed;inset:0;background:#000c;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.image-modal.open{display:flex}.image-modal img{max-width:100%;max-height:100%;border-radius:8px}
.footer{max-width:820px;margin:0 auto;padding:28px 18px 42px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;text-align:center}
@media(max-width:720px){
  .header-inner{height:54px;padding:0 14px}.brand{font-size:15px}.brand small{display:none}.nav{gap:1px}.nav button,.admin-link{font-size:12px;padding:7px 8px}
  .main{padding:22px 15px 50px}.page-title h1{font-size:24px}.page-title p{font-size:13px}
  .filters{grid-template-columns:1fr 1fr;gap:7px}.search{grid-column:1/-1}
  .item{padding:15px 0 18px}.item-top{font-size:12px}.score{margin-left:0}.title{font-size:16px}.summary,.reason{font-size:13px}
  .image-strip img{height:98px;max-width:158px}.sources-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#" onclick="setView('featured');return false;">品质生活情报库<small>PREMIUM LIFESTYLE INTEL</small></a>
    <nav class="nav">
      <button data-view="featured" class="active" onclick="setView('featured')">精选</button>
      <button data-view="all" onclick="setView('all')">全部</button>
      <button data-view="daily" onclick="setView('daily')">日报</button>
      <button data-view="sources" onclick="setView('sources')">信源</button>
      <button data-view="about" onclick="setView('about')">关于</button>
      <a class="admin-link" href="/">筛选后台</a>
    </nav>
  </div>
</header>

<main class="main">
  <section class="page-title" id="pageTitle">
    <h1>精选</h1>
    <p>AI 初筛与人工二筛后的高品质生活方式情报</p>
  </section>

  <section id="filterPanel">
    <div class="category-row" id="categoryRow"><button class="chip active" data-cat="all" onclick="setCategory('all')">全部</button></div>
    <div class="filters">
      <div class="search"><input id="searchInput" placeholder="搜索标题、摘要、标签、推荐理由" oninput="applySearch()"></div>
      <select id="sourceSelect" onchange="renderArticles()"><option value="all">全部来源</option></select>
      <select id="dateSelect" onchange="renderArticles()">
        <option value="all">全部日期</option>
        <option value="today">今天</option>
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
      </select>
      <select id="scoreSelect" onchange="renderArticles()">
        <option value="0">全部评分</option>
        <option value="60">60 分以上</option>
        <option value="70">70 分以上</option>
        <option value="80">80 分以上</option>
      </select>
    </div>
  </section>

  <div class="meta-line" id="metaLine"></div>
  <section id="content"><div class="empty">加载中...</div></section>
</main>

<div class="image-modal" id="imageModal" onclick="this.classList.remove('open')"><img id="modalImage" alt=""></div>
<footer class="footer">每日抓取，人工筛选，周五生成适合微信阅读的 H5 图文周报</footer>

<script>
let allArticles = [];
let allSources = [];
let currentView = 'featured';
let currentCategory = 'all';
let query = '';

const titleMap = {
  featured: ['精选', 'AI 初筛与人工二筛后的高品质生活方式情报'],
  all: ['全部', '已进入候选库的完整内容流'],
  daily: ['日报', '按抓取日期归档的每日生活方式情报'],
  sources: ['信源', '持续监控的全球精品网站'],
  about: ['关于', '面向 DJ 的高品质生活体验情报系统']
};

function asArray(value){
  if (Array.isArray(value)) return value;
  if (!value) return [];
  try { return JSON.parse(value); } catch(e) { return []; }
}

function escapeHtml(value){
  return String(value || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

async function init(){
  const [articlesRes, sourcesRes] = await Promise.all([
    fetch('/api/public/articles?limit=1000'),
    fetch('/api/public/sources')
  ]);
  allArticles = await articlesRes.json();
  allSources = await sourcesRes.json();
  buildFilters();
  renderArticles();
}

function buildFilters(){
  const cats = new Map();
  const sources = new Set();
  allArticles.forEach(a => {
    if (a.category) cats.set(a.category, (cats.get(a.category) || 0) + 1);
    if (a.source) sources.add(a.source);
  });

  const catRow = document.getElementById('categoryRow');
  catRow.innerHTML = '<button class="chip active" data-cat="all" onclick="setCategory(\'all\')">全部</button>';
  [...cats.entries()].sort((a,b)=>b[1]-a[1]).forEach(([cat,count]) => {
    catRow.innerHTML += `<button class="chip" data-cat="${escapeHtml(cat)}" onclick="setCategory('${escapeHtml(cat)}')">${escapeHtml(cat)} ${count}</button>`;
  });

  const sourceSelect = document.getElementById('sourceSelect');
  sourceSelect.innerHTML = '<option value="all">全部来源</option>';
  [...sources].sort((a,b)=>a.localeCompare(b,'zh-CN')).forEach(src => {
    sourceSelect.innerHTML += `<option value="${escapeHtml(src)}">${escapeHtml(src)}</option>`;
  });
}

function setView(view){
  currentView = view;
  document.querySelectorAll('.nav button').forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
  const [heading, sub] = titleMap[view];
  document.getElementById('pageTitle').innerHTML = `<h1>${heading}</h1><p>${sub}</p>`;
  document.getElementById('filterPanel').style.display = ['sources','about'].includes(view) ? 'none' : 'block';
  document.getElementById('metaLine').style.display = ['sources','about'].includes(view) ? 'none' : 'flex';
  if (view === 'sources') return renderSources();
  if (view === 'about') return renderAbout();
  renderArticles();
}

function setCategory(cat){
  currentCategory = cat;
  document.querySelectorAll('.chip').forEach(chip => chip.classList.toggle('active', chip.dataset.cat === cat));
  renderArticles();
}

function applySearch(){
  query = document.getElementById('searchInput').value.trim().toLowerCase();
  renderArticles();
}

function filteredArticles(){
  const source = document.getElementById('sourceSelect').value;
  const scoreMin = Number(document.getElementById('scoreSelect').value || 0);
  const dateRange = document.getElementById('dateSelect').value;
  const now = new Date();

  return allArticles.filter(a => {
    if (currentView === 'featured' && Number(a.score || 0) < 70 && !['必看','推荐'].includes(a.recommend_level)) return false;
    if (currentCategory !== 'all' && a.category !== currentCategory) return false;
    if (source !== 'all' && a.source !== source) return false;
    if (Number(a.score || 0) < scoreMin) return false;
    if (dateRange !== 'all') {
      const d = parseDate(a.crawled_at);
      if (!d) return false;
      const diffDays = Math.floor((now - d) / 86400000);
      if (dateRange === 'today' && diffDays !== 0) return false;
      if (dateRange !== 'today' && diffDays > Number(dateRange)) return false;
    }
    if (query) {
      const tags = asArray(a.tags).join(' ');
      const haystack = `${a.title || ''} ${a.summary || ''} ${a.recommend_reason || ''} ${a.category || ''} ${a.source || ''} ${tags}`.toLowerCase();
      if (!haystack.includes(query)) return false;
    }
    return true;
  }).sort((a,b) => String(b.crawled_at || '').localeCompare(String(a.crawled_at || '')) || Number(b.score || 0) - Number(a.score || 0));
}

function renderArticles(){
  const list = filteredArticles();
  document.getElementById('metaLine').innerHTML = `<span>${list.length} 条内容</span><span>${new Date().toLocaleDateString('zh-CN')}</span>`;
  if (!list.length) {
    document.getElementById('content').innerHTML = '<div class="empty">暂无匹配内容</div>';
    return;
  }

  const groups = new Map();
  list.forEach(a => {
    const key = dateKey(a.crawled_at);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  });

  let html = '';
  [...groups.entries()].forEach(([date, items]) => {
    html += `<section class="date-group"><div class="date-heading">${formatDateLabel(date)}</div>`;
    items.forEach(a => html += articleHtml(a));
    html += '</section>';
  });
  document.getElementById('content').innerHTML = html;
}

function articleHtml(a){
  const images = asArray(a.images).filter(Boolean);
  const tags = asArray(a.tags).filter(Boolean);
  const time = timeLabel(a.crawled_at);
  const levelClass = a.recommend_level === '必看' ? 'must' : a.recommend_level === '推荐' ? 'rec' : 'know';
  const imageHtml = images.length ? `<div class="image-strip">${images.slice(0,4).map(img => {
    const src = imageSrc(img);
    return `<img src="${escapeHtml(src)}" loading="lazy" onclick="showImage('${escapeHtml(src)}')" onerror="this.style.display='none'">`;
  }).join('')}</div>` : '';
  const tagHtml = tags.length ? `<div class="tags">${tags.slice(0,8).map(t=>`<span class="tag" onclick="searchTag('${escapeHtml(t)}')">${escapeHtml(t)}</span>`).join('')}</div>` : '';
  const reason = a.recommend_reason ? `<div class="reason">推荐理由：${escapeHtml(a.recommend_reason)}</div>` : '';
  return `<article class="item">
    <div class="item-top">
      ${time ? `<span>${time}</span>` : ''}
      <span>${escapeHtml(a.source)}</span>
      <span class="level ${levelClass}">${escapeHtml(a.recommend_level || '了解')}</span>
      <span class="score">精选 ${Number(a.score || 0)}</span>
    </div>
    <h2 class="title"><a href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(a.title)}</a></h2>
    <p class="summary">${escapeHtml(a.summary || String(a.content || '').slice(0,180))}</p>
    ${imageHtml}
    ${tagHtml}
    ${reason}
    <div class="related">${escapeHtml(a.category || '')}</div>
  </article>`;
}

function renderSources(){
  const byCat = new Map();
  allSources.forEach(s => {
    const cat = s.category_hint || '其他';
    if (!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push(s);
  });
  let html = '<div class="sources-grid">';
  [...byCat.entries()].sort((a,b)=>a[0].localeCompare(b[0],'zh-CN')).forEach(([cat, items]) => {
    items.forEach(s => {
      html += `<a class="source-card" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer"><b>${escapeHtml(s.name)}</b><span>${escapeHtml(cat)}</span></a>`;
    });
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function renderAbout(){
  document.getElementById('content').innerHTML = `<section class="about">
    <h2>AI 驱动的全球高品质生活方式情报系统</h2>
    <p>系统自动监控约 30-50 个全球精品网站，获取标题、摘要、完整正文、图片和元数据，并结合预设关键词与 DJ 人物画像进行 AI 筛选。</p>
    <p>内容会归入 10 大高品质生活体验系统，输出推荐评分、摘要、标签和推荐理由。每日进入候选库后人工二筛，周五生成适合微信手机阅读的 H5 图文周报。</p>
    <p>长期目标是沉淀为可搜索、可追溯的高品质生活体验数据库。</p>
  </section>`;
}

function parseDate(value){
  if (!value) return null;
  const normalized = String(value).replace(' ', 'T');
  const d = new Date(normalized);
  return Number.isNaN(d.getTime()) ? null : d;
}

function dateKey(value){
  const text = String(value || '');
  if (text.includes('T')) return text.split('T')[0];
  if (text.includes(' ')) return text.split(' ')[0];
  return text.slice(0,10) || 'unknown';
}

function timeLabel(value){
  const text = String(value || '');
  const time = text.includes('T') ? text.split('T')[1] : text.split(' ')[1];
  return time ? time.slice(0,5) : '';
}

function formatDateLabel(date){
  if (date === 'unknown') return '未知日期';
  const d = new Date(date + 'T00:00:00');
  const today = new Date();
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const diff = Math.floor((start - d) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function imageSrc(path){
  if (/^https?:\/\//.test(path) || path.startsWith('/static/') || path.startsWith('/output/')) return path;
  const clean = String(path).split(/[\\/]/).pop();
  return '/static/images/' + clean;
}

function searchTag(tag){
  document.getElementById('searchInput').value = tag;
  query = tag.toLowerCase();
  renderArticles();
}

function showImage(src){
  document.getElementById('modalImage').src = src;
  document.getElementById('imageModal').classList.add('open');
}

init().catch(() => {
  document.getElementById('content').innerHTML = '<div class="empty">加载失败</div>';
});
</script>
</body>
</html>
